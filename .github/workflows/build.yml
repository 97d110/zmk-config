name: Build ZMK firmware

on:
  workflow_dispatch:
  pull_request:
    paths-ignore:
      - "keymap-drawer/**"
  push:
    paths-ignore:
      - "keymap-drawer/**"

permissions:
  contents: read

jobs:
  build:
    uses: zmkfirmware/zmk/.github/workflows/build-user-config.yml@v0.3

  release:
    name: Release firmware bundle
    needs: build
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch' || (github.event_name == 'push' && github.ref_name == github.event.repository.default_branch)
    permissions:
      actions: read
      contents: write
    env:
      RELEASE_TAG: firmware-${{ github.run_number }}.${{ github.run_attempt }}
      RELEASE_NAME: Firmware ${{ github.run_number }}.${{ github.run_attempt }}
      ZIP_NAME: eyelash-sofle-firmware-${{ github.run_number }}.${{ github.run_attempt }}.zip
    steps:
      - name: Download firmware artifact archive
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          artifact_id="$(
            gh api "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/artifacts" \
              --jq '.artifacts[] | select(.name == "firmware") | .id' \
              | head -n 1
          )"

          if [[ -z "$artifact_id" ]]; then
            echo "No firmware artifact found for workflow run $GITHUB_RUN_ID" >&2
            exit 1
          fi

          curl --fail --location \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "Accept: application/vnd.github+json" \
            --output "$ZIP_NAME" \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$RELEASE_TAG" "$ZIP_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$RELEASE_NAME" \
            --target "$GITHUB_SHA" \
            --notes "Firmware artifacts from workflow run $GITHUB_RUN_NUMBER."
